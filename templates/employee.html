<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Add Employee | FaceAttend AI</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <div class="employee-page">
      <div class="employee-card">
        <div class="login-logo">FaceAttend <span>AI</span></div>

        <h1>Add Employee</h1>

        <p class="login-subtitle">Register a new employee</p>

        <form id="employeeForm" class="employee-form">
          <div class="form-group">
            <label>Employee Code</label>

            <input
              type="text"
              id="employee_code"
              placeholder="EMP001"
              required
            />
          </div>

          <div class="form-group">
            <label>Name</label>

            <input
              type="text"
              id="name"
              placeholder="Enter employee name"
              required
            />
          </div>

          <div class="form-group">
            <label>Email</label>

            <input
              type="email"
              id="email"
              placeholder="Enter employee email"
              required
            />
          </div>

          <button type="submit" class="login-button">Add Employee</button>
        </form>

        <p id="employeeMessage"></p>

        <div id="faceCaptureSection" style="display: none">
          <h2>Capture Employee Face</h2>

          <p>Employee added successfully. Now capture the employee's face.</p>

          <video id="camera" width="400" height="300" autoplay></video>

          <br /><br />

          <button type="button" id="captureFaceButton" class="login-button">
            📷 Capture Face
          </button>

          <!-- <canvas id="faceCanvas" style="display: none"></canvas> -->
           <canvas id="faceCanvas" style="display: block; margin-top: 15px;"></canvas>

          <p id="faceMessage"></p>
        </div>

        <p class="register-text">
          <a href="/dashboard">← Back to Dashboard</a>
        </p>
      </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
